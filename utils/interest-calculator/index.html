<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interest Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card" role="application" aria-label="Interest Calculator">
    <h1>Interest Calculator</h1>

    <label for="principal">Principal</label>
    <input id="principal" type="number" min="0" step="any" value="1000" />

    <label for="rate">Annual rate (%)</label>
    <input id="rate" type="number" min="0" step="any" value="5" />

    <label for="time">Time (years)</label>
    <input id="time" type="number" min="0" step="any" value="2" />

    <fieldset class="mode">
      <legend>Interest type</legend>
      <label>
        <input type="radio" name="mode" value="simple" checked />
        Simple
      </label>
      <label>
        <input type="radio" name="mode" value="compound" />
        Compound
      </label>
    </fieldset>

    <div class="compound-only">
      <label for="frequency">Compounds per year</label>
      <input id="frequency" type="number" min="1" step="1" value="1" />
    </div>

    <button id="calculate">Calculate</button>

    <div class="result">
      <div>
        <span class="result-label">Interest</span>
        <span id="interest" class="result-value">0</span>
      </div>
      <div>
        <span class="result-label">Total amount</span>
        <span id="total" class="result-value">0</span>
      </div>
    </div>
  </main>
  <script src="interest.js"></script>
</body>
</html>
